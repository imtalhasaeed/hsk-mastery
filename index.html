<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Mastery Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e11d48; /* HSK Red */
            --primary-hover: #be123c;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --correct: #22c55e;
            --wrong: #ef4444;
            --accent: #3b82f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Container & Card */
        .app-container {
            width: 100%;
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1);
            padding: 2rem;
            overflow: hidden;
            position: relative;
            transition: all 0.3s ease;
        }

        h1, h2, h3 { text-align: center; color: var(--text-main); }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; color: var(--primary); }
        
        .chinese-text {
            font-family: 'Noto Sans SC', sans-serif;
        }

        /* Screen Visibility */
        .screen { display: none; animation: fadeIn 0.4s ease; }
        .screen.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- START SCREEN --- */
        .form-group { margin-bottom: 1.5rem; }
        .form-label { display: block; font-weight: 600; margin-bottom: 0.5rem; color: var(--text-sub); }
        
        .btn-group { display: flex; gap: 10px; }
        .selection-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-sub);
            transition: all 0.2s;
        }
        .selection-btn.selected {
            border-color: var(--primary);
            background-color: #fff1f2;
            color: var(--primary);
        }

        /* Range Slider */
        .range-container { margin-top: 10px; }
        input[type=range] {
            width: 100%;
            accent-color: var(--primary);
            height: 6px;
            background: #e2e8f0;
            border-radius: 5px;
            outline: none;
        }
        .range-value {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            margin-top: 5px;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
            transition: transform 0.1s;
        }
        .start-btn:active { transform: scale(0.98); }

        /* High Score Badge */
        .high-score-badge {
            background: #fff7ed;
            color: #c2410c;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }

        /* --- QUIZ SCREEN --- */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-sub);
        }
        
        .progress-bar {
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }
        .main-q {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .main-q:hover { color: var(--primary); }
        .sub-q {
            font-size: 1.2rem;
            color: var(--text-sub);
            min-height: 1.5rem;
        }
        /* Audio Hint */
        .audio-hint {
            font-size: 0.8rem;
            color: var(--accent);
            margin-top: 5px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .option-card {
            background: white;
            border: 2px solid #e2e8f0;
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 80px;
            position: relative;
        }
        /* Keyboard shortcut badge */
        .key-badge {
            position: absolute;
            top: 5px;
            left: 5px;
            font-size: 0.7rem;
            background: #f1f5f9;
            color: #94a3b8;
            width: 18px;
            height: 18px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .option-card:hover { border-color: var(--accent); background: #eff6ff; }
        .option-card.correct { background: #dcfce7; border-color: var(--correct); color: #166534; }
        .option-card.wrong { background: #fee2e2; border-color: var(--wrong); color: #991b1b; }
        .option-card.disabled { pointer-events: none; opacity: 0.7; }
        
        .opt-main { font-size: 1.2rem; font-weight: bold; margin-bottom: 4px; }
        .opt-sub { font-size: 0.85rem; color: inherit; opacity: 0.8; }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        .icon-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .icon-btn:hover { color: var(--text-main); }

        /* --- RESULT SCREEN --- */
        .score-display {
            text-align: center;
            margin-bottom: 30px;
        }
        .big-score {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .score-label { color: var(--text-sub); font-size: 1.1rem; }

        .mistakes-area {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
        .mistake-item {
            background: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid var(--wrong);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mistake-info h4 { margin: 0; font-size: 1.1rem; }
        .mistake-info p { margin: 0; font-size: 0.85rem; color: var(--text-sub); }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }
        
        @media (max-width: 500px) {
            .options-grid { grid-template-columns: 1fr; }
            .key-badge { display: none; } /* Hide shortcuts on mobile */
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div class="app-container">
        
        <!-- 1. SETUP SCREEN -->
        <div id="screen-setup" class="screen card active">
            <h1>HSK Training</h1>
            <p style="text-align:center; color:var(--text-sub); margin-bottom: 1rem;">Master your vocabulary</p>

            <div class="high-score-badge" id="high-score-display">
                <span>🏆 Personal Best: 0%</span>
            </div>

            <!-- Level Selection -->
            <div class="form-group">
                <label class="form-label">Select Level</label>
                <div class="btn-group">
                    <button class="selection-btn selected" onclick="selectLevel('hsk1', this)">HSK 1</button>
                    <button class="selection-btn" onclick="selectLevel('hsk2', this)">HSK 2</button>
                    <button class="selection-btn" onclick="selectLevel('combined', this)">Both</button>
                </div>
            </div>

            <!-- Mode Selection -->
            <div class="form-group">
                <label class="form-label">Quiz Mode</label>
                <div class="btn-group">
                    <button class="selection-btn selected" onclick="selectMode('pinyin-to-char', this)">Pinyin ➔ 汉字</button>
                    <button class="selection-btn" onclick="selectMode('char-to-pinyin', this)">汉字 ➔ Pinyin</button>
                </div>
            </div>

            <!-- Question Count Slider -->
            <div class="form-group">
                <label class="form-label">Number of Questions</label>
                <div class="range-container">
                    <input type="range" id="q-slider" min="5" max="150" value="20" oninput="updateSliderVal(this.value)">
                    <div class="range-value" id="q-display">20</div>
                </div>
            </div>

            <button class="start-btn" onclick="initQuiz()">Start Test</button>
        </div>

        <!-- 2. QUIZ SCREEN -->
        <div id="screen-quiz" class="screen card">
            <div class="quiz-header">
                <span id="timer">00:00</span>
                <span>Score: <span id="live-score" style="color:var(--primary); font-weight:bold;">0</span></span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div class="question-box" onclick="speakCurrentQuestion()">
                <div class="main-q chinese-text" id="q-main">N/A</div>
                <div class="audio-hint">🔊 Click text to listen</div>
                <div class="sub-q" id="q-sub"></div>
            </div>

            <div class="options-grid" id="options-area">
                <!-- Options injected here -->
            </div>

            <div class="controls">
                <button class="icon-btn" onclick="goToSetup()">← Menu</button>
                <button class="icon-btn" onclick="initQuiz()">↻ Restart</button>
            </div>
        </div>

        <!-- 3. RESULT SCREEN -->
        <div id="screen-result" class="screen card">
            <h1>Test Complete!</h1>
            
            <div class="score-display">
                <div class="big-score" id="final-score">95%</div>
                <div class="score-label" id="final-text">You got 19 out of 20</div>
            </div>

            <div id="mistakes-container" style="display:none;">
                <h3 style="text-align:left; margin-bottom:10px; font-size:1rem;">Review Mistakes</h3>
                <div class="mistakes-area" id="mistakes-list">
                    <!-- Mistakes injected here -->
                </div>
            </div>

            <button class="start-btn" onclick="goToSetup()">Back to Main Menu</button>
        </div>

    </div>

/* --- APP STATE --- */
let state = {
    level: 'hsk1',
    mode: 'pinyin-to-char',
    qCount: 20,
    questions: [],
    currentIndex: 0,
    score: 0,
    mistakes: [],
    timerSeconds: 0,
    timerInterval: null
};

/* --- INIT & STORAGE --- */
window.onload = function() {
    // Load saved settings
    const savedLevel = localStorage.getItem('hsk_level');
    const savedMode = localStorage.getItem('hsk_mode');
    
    if(savedLevel) {
        state.level = savedLevel;
        updateSelectionStyles(document.querySelector(`button[onclick="selectLevel('${savedLevel}', this)"]`));
    }
    if(savedMode) {
        state.mode = savedMode;
        updateSelectionStyles(document.querySelector(`button[onclick="selectMode('${savedMode}', this)"]`));
    }
    
    updateHighScoreDisplay();
    updateSliderVal(20);

    // Keyboard Listener
    document.addEventListener('keydown', handleKeydown);
};

function handleKeydown(e) {
    if (!document.getElementById('screen-quiz').classList.contains('active')) return;
    
    const key = e.key;
    if (['1', '2', '3', '4'].includes(key)) {
        const index = parseInt(key) - 1;
        const options = document.querySelectorAll('.option-card');
        if (options[index] && !options[index].classList.contains('disabled')) {
            options[index].click();
        }
    }
}

/* --- UI LOGIC --- */

function selectLevel(level, btn) {
    state.level = level;
    localStorage.setItem('hsk_level', level);
    updateSelectionStyles(btn);
    updateHighScoreDisplay();
    
    const slider = document.getElementById('q-slider');
    const max = level === 'combined' ? 300 : 150;
    slider.max = max;
    if(parseInt(slider.value) > max) {
        slider.value = max;
        updateSliderVal(max);
    }
}

function selectMode(mode, btn) {
    state.mode = mode;
    localStorage.setItem('hsk_mode', mode);
    updateSelectionStyles(btn);
}

function updateSelectionStyles(clickedBtn) {
    if(!clickedBtn) return;
    const siblings = clickedBtn.parentNode.children;
    for(let btn of siblings) btn.classList.remove('selected');
    clickedBtn.classList.add('selected');
}

function updateSliderVal(val) {
    state.qCount = val;
    document.getElementById('q-display').textContent = val;
}

function updateHighScoreDisplay() {
    const score = localStorage.getItem(`hsk_best_${state.level}`) || 0;
    document.getElementById('high-score-display').innerHTML = `<span>🏆 Personal Best for ${state.level.toUpperCase()}: ${score}%</span>`;
}

function goToSetup() {
    clearInterval(state.timerInterval);
    showScreen('screen-setup');
    updateHighScoreDisplay();
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

/* --- AUDIO LOGIC --- */
function speakText(text) {
    if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8; // Slightly slower for learners
        window.speechSynthesis.speak(utterance);
    }
}

function speakCurrentQuestion() {
    const q = state.questions[state.currentIndex];
    if (q) speakText(q.hanzi);
}

/* --- QUIZ ENGINE --- */

function initQuiz() {
    let pool = [];
    if(state.level === 'hsk1') pool = [...hsk1Data];
    else if(state.level === 'hsk2') pool = [...hsk2Data];
    else pool = [...hsk1Data, ...hsk2Data];

    pool.sort(() => 0.5 - Math.random());
    state.questions = pool.slice(0, state.qCount);
    state.currentIndex = 0;
    state.score = 0;
    state.mistakes = [];
    state.timerSeconds = 0;

    document.getElementById('live-score').textContent = 0;
    document.getElementById('progress-fill').style.width = '0%';
    
    if(state.timerInterval) clearInterval(state.timerInterval);
    state.timerInterval = setInterval(() => {
        state.timerSeconds++;
        const m = Math.floor(state.timerSeconds / 60).toString().padStart(2,'0');
        const s = (state.timerSeconds % 60).toString().padStart(2,'0');
        document.getElementById('timer').textContent = `${m}:${s}`;
    }, 1000);

    showScreen('screen-quiz');
    loadQuestion();
}

function loadQuestion() {
    if (state.currentIndex >= state.questions.length) {
        endQuiz();
        return;
    }

    const q = state.questions[state.currentIndex];
    const isCharToPinyin = state.mode === 'char-to-pinyin';

    const mainEl = document.getElementById('q-main');
    const subEl = document.getElementById('q-sub');
    
    if (isCharToPinyin) {
        mainEl.textContent = q.hanzi;
        subEl.textContent = ""; 
    } else {
        mainEl.textContent = q.pinyin;
        subEl.textContent = ""; 
    }

    let distractors = [];
    let fullPool = state.level === 'hsk1' ? hsk1Data : (state.level === 'hsk2' ? hsk2Data : [...hsk1Data, ...hsk2Data]);
    
    while(distractors.length < 3) {
        const r = fullPool[Math.floor(Math.random() * fullPool.length)];
        if (r.hanzi !== q.hanzi && !distractors.includes(r)) {
            distractors.push(r);
        }
    }

    let options = [q, ...distractors];
    options.sort(() => 0.5 - Math.random());

    const container = document.getElementById('options-area');
    container.innerHTML = '';

    options.forEach((opt, index) => {
        const btn = document.createElement('div');
        btn.className = 'option-card';
        
        let mainText = isCharToPinyin ? opt.pinyin : opt.hanzi;
        if (isCharToPinyin) mainText += ` (${opt.en})`;
        let subText = opt.en;

        btn.innerHTML = `
            <div class="key-badge">${index + 1}</div>
            <div class="opt-main ${isCharToPinyin ? '' : 'chinese-text'}">${mainText}</div>
            <div class="opt-sub">${subText}</div>
        `;
        
        btn.onclick = () => handleAnswer(opt, q, btn);
        container.appendChild(btn);
    });

    const pct = ((state.currentIndex) / state.qCount) * 100;
    document.getElementById('progress-fill').style.width = `${pct}%`;
}

function handleAnswer(selected, correct, btnElement) {
    const allOpts = document.querySelectorAll('.option-card');
    allOpts.forEach(o => o.classList.add('disabled'));

    const isCorrect = selected.hanzi === correct.hanzi;

    // Auto play sound of the CORRECT word
    speakText(correct.hanzi);

    if (isCorrect) {
        state.score++;
        document.getElementById('live-score').textContent = state.score;
        btnElement.classList.add('correct');
    } else {
        btnElement.classList.add('wrong');
        allOpts.forEach(o => {
            if(o.innerHTML.includes(correct.en)) o.classList.add('correct'); 
        });
        state.mistakes.push({ q: correct, wrong: selected });
    }

    setTimeout(() => {
        state.currentIndex++;
        loadQuestion();
    }, 1500); // Slightly longer delay to allow audio to finish
}

function endQuiz() {
    clearInterval(state.timerInterval);
    showScreen('screen-result');

    const pct = Math.round((state.score / state.qCount) * 100);
    document.getElementById('final-score').textContent = pct + '%';
    document.getElementById('final-text').textContent = `You got ${state.score} out of ${state.qCount}`;

    // Save High Score
    const key = `hsk_best_${state.level}`;
    const currentBest = localStorage.getItem(key) || 0;
    if (pct > currentBest) {
        localStorage.setItem(key, pct);
    }

    // Confetti if good score
    if (pct >= 70) {
        fireConfetti();
    }

    const mistContainer = document.getElementById('mistakes-container');
    const mistList = document.getElementById('mistakes-list');
    
    if (state.mistakes.length > 0) {
        mistContainer.style.display = 'block';
        mistList.innerHTML = '';
        state.mistakes.forEach(m => {
            const item = document.createElement('div');
            item.className = 'mistake-item';
            item.innerHTML = `
                <div class="mistake-info">
                    <h4>${m.q.hanzi} (${m.q.pinyin})</h4>
                    <p>Meaning: ${m.q.en}</p>
                </div>
                <div style="color:var(--wrong); font-size:0.9rem;">
                    You picked: ${state.mode === 'char-to-pinyin' ? m.wrong.pinyin : m.wrong.hanzi}
                </div>
            `;
            mistList.appendChild(item);
        });
    } else {
        mistContainer.style.display = 'none';
    }
}

/* --- CONFETTI EFFECT (Simple implementation) --- */
function fireConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    let particles = [];
    const colors = ['#e11d48', '#3b82f6', '#22c55e', '#fbbf24'];
    
    for(let i=0; i<100; i++) {
        particles.push({
            x: canvas.width/2, 
            y: canvas.height/2,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() - 1.5) * 15,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random()*colors.length)],
            life: 100
        });
    }
    
    function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        let active = false;
        particles.forEach(p => {
            if(p.life > 0) {
                active = true;
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5; // Gravity
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            }
        });
        if(active) requestAnimationFrame(animate);
        else ctx.clearRect(0,0,canvas.width,canvas.height);
    }
    animate();
}

updateSliderVal(20);
